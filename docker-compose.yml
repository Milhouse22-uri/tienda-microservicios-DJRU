x-pg: &pg
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: tienda
  DB_PASSWORD: tienda123

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda123
      POSTGRES_DB: tienda
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda"]
      interval: 5s
      retries: 10
    networks: [red-tienda]

  mongo:
    image: mongo:7
    volumes: [mongodata:/data/db]
    ports: ["27017:27017"]
    networks: [red-tienda]

