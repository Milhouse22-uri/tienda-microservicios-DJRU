<div class="layout">
  <aside class="sidebar">
    <a routerLink="/" class="logo"> Tienda</a>

    <nav class="menu">
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
         Catálogo
      </a>
      <a routerLink="/carrito" routerLinkActive="activo">
         Carrito
      </a>
      <a routerLink="/pedidos" routerLinkActive="activo">
         Mis pedidos
      </a>
    </nav>

    <button class="btn secundario" type="button" (click)="cambiarTema()">
      {{ tema() === 'oscuro' ? ' Tema claro' : ' Tema oscuro' }}
    </button>

    <div class="usuario">
      @if (sesion.usuario(); as u) {
        <span class="saludo">{{ u.nombre }}</span>
        <button class="btn secundario" type="button" (click)="salir()">Cerrar sesión</button>
      } @else {
        <a class="btn" routerLink="/login">Iniciar sesión</a>
      }
    </div>
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
